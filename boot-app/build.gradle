plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Project dependencies
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation project(':boot-libs:helloworld-util')
    implementation project(':boot-libs:goodbye-util')

    // Testing dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    // For JUnit 5
    useJUnitPlatform()
}

tasks.named('bootRun') {
    // Keep packaged app defaults intact while making local bootRun resilient to 8080 conflicts.
    def bootRunPort = project.findProperty('bootRunPort') ?: '8081'
    args "--server.port=${bootRunPort}"
}
